<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Brand Color Gradients preserving original tones -->
    <linearGradient id="vnTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6E7B" />
      <stop offset="100%" stop-color="#155E75" />
    </linearGradient>
    <linearGradient id="vnOrangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="vnGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="vnGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B6E7B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- 1. TOP SKYLINE (BUILDINGS) -->
    <!-- Left Teal Building -->
    <path d="M 222 118 L 222 55 C 222 52, 226 50, 230 50 L 244 50 C 248 50, 252 52, 252 55 L 252 118 Z" fill="url(#vnTealGrad)"/>
    <rect x="230" y="60" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="238" y="60" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="230" y="74" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="238" y="74" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="230" y="88" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="238" y="88" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>

    <!-- Middle Gold Taller Building -->
    <path d="M 250 118 L 250 35 C 250 31, 255 28, 260 28 L 276 28 C 281 28, 286 31, 286 35 L 286 118 Z" fill="url(#vnGoldGrad)"/>
    <rect x="258" y="38" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="268" y="38" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="258" y="52" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="268" y="52" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="258" y="66" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="268" y="66" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="258" y="80" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="268" y="80" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.9"/>

    <!-- Right Orange Building -->
    <path d="M 284 118 L 284 52 C 284 48, 288 45, 292 45 L 306 45 C 310 45, 314 48, 314 52 L 314 118 Z" fill="url(#vnOrangeGrad)"/>
    <rect x="291" y="56" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="299" y="56" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="291" y="70" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="299" y="70" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="291" y="84" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="299" y="84" width="6" height="8" rx="1" fill="#FFFFFF" opacity="0.8"/>

    <!-- 2. HEART SHAPE INNER CANVAS & OUTLINE -->
    <!-- Background Heart Canvas (Soft White) -->
    <path d="M 250 118 
             C 210 70, 160 90, 160 155 
             C 160 215, 205 270, 250 315 
             C 295 270, 340 215, 340 155 
             C 340 90, 290 70, 250 118 Z" 
          fill="#FFFFFF" />

    <!-- Left Outer Teal Ribbon / Heart Arch -->
    <path d="M 250 118 
             C 200 60, 140 85, 140 160 
             C 140 235, 195 295, 250 340
             C 230 310, 162 250, 162 165
             C 162 108, 208 85, 250 128 Z" 
          fill="url(#vnTealGrad)" />

    <!-- Supporting Hand / Bottom-Right Golden Ribbon -->
    <path d="M 250 340
             C 290 310, 335 265, 350 205
             C 358 175, 348 150, 335 155
             C 320 160, 318 190, 295 235
             C 275 275, 250 300, 230 315
             C 210 290, 180 260, 155 240
             C 145 232, 138 250, 150 265
             C 175 295, 215 325, 250 340 Z" 
          fill="url(#vnOrangeGrad)" />

    <!-- Ribbon Accent Ribbon Wrap around base -->
    <path d="M 152 245
             C 140 248, 135 268, 150 280
             C 180 305, 215 330, 250 345
             C 220 325, 175 295, 152 245 Z"
          fill="url(#vnOrangeGrad)" opacity="0.9" />

    <!-- Top Ribbon Curl Over Notch -->
    <path d="M 250 118 C 265 105, 290 100, 315 110 C 330 116, 325 128, 305 125 C 285 122, 265 125, 250 135 Z" fill="url(#vnGoldGrad)" />

    <!-- 3. FOUR LOCAL SECTOR ICONS (INSIDE HEART) -->
    <!-- Top-Left: Healthcare Cross Icon -->
    <g transform="translate(185, 150)">
      <rect x="12" y="4" width="8" height="24" rx="2" fill="#0B6E7B" />
      <rect x="4" y="12" width="24" height="8" rx="2" fill="#0B6E7B" />
    </g>

    <!-- Top-Right: Retail Shopping Cart Icon -->
    <g transform="translate(280, 152)">
      <path d="M 2 4 L 8 4 L 12 20 L 28 20 L 32 8 L 10 8" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="25" r="2.5" fill="#EA580C" />
      <circle cx="26" cy="25" r="2.5" fill="#EA580C" />
    </g>

    <!-- Bottom-Left: Education / Knowledge Open Book Icon -->
    <g transform="translate(190, 230)">
      <path d="M 16 6 C 11 3, 4 4, 2 6 L 2 22 C 4 20, 11 19, 16 22 C 21 19, 28 20, 30 22 L 30 6 C 28 4, 21 3, 16 6 Z" fill="none" stroke="#0B6E7B" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="16" y1="6" x2="16" y2="22" stroke="#0B6E7B" stroke-width="2.5"/>
    </g>

    <!-- Bottom-Right: Fitness / Wellness Dumbbell Icon -->
    <g transform="translate(272, 222) rotate(-30, 16, 16)">
      <rect x="2" y="8" width="5" height="16" rx="2" fill="#0B6E7B"/>
      <rect x="7" y="11" width="3" height="10" rx="1" fill="#0B6E7B"/>
      <line x1="10" y1="16" x2="22" y2="16" stroke="#0B6E7B" stroke-width="4" stroke-linecap="round"/>
      <rect x="22" y="11" width="3" height="10" rx="1" fill="#0B6E7B"/>
      <rect x="25" y="8" width="5" height="16" rx="2" fill="#0B6E7B"/>
    </g>

    <!-- 4. UPWARD GROWTH TREND ARROW (GREEN ZIG-ZAG + ARROW HEAD) -->
    <!-- Growth Line -->
    <path d="M 155 240
             L 210 200
             L 245 228
             L 285 155
             L 305 168
             L 330 110" 
          fill="none" 
          stroke="url(#vnGreenGrad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Arrow Head at top right pointing up-right -->
    <path d="M 310 100 L 350 100 L 340 140 Z" fill="url(#vnGreenGrad)" />
  </g>
</svg>
